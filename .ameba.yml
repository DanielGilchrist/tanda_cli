# Exclusions
Lint/DebugCalls:
  Excluded:
    - src/tanda_cli/debug.cr

# Disabled by default
Layout/LineLength:
  Enabled: true
  MaxLength: 180 # default

Lint/ComparisonToBoolean:
  Enabled: true

Style/GuardClause:
  Enabled: false

Style/LargeNumbers:
  Enabled: true
  IntMinDigits: 5 # i.e. integers higher than 9999
  Excluded:
    - spec/**/*

Style/PredicateName:
  Enabled: true

Lint/UselessAssign:
  Enabled: true
  ExcludeTypeDeclarations: true

Lint/SpecFilename:
  Enabled: true

Lint/NotNil:
  Enabled: true
  Excluded:
    - spec/**/*

Typing/MethodParameterTypeRestriction:
  Enabled: true
  DefaultValue: true
  BlockParameters: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/MethodReturnTypeRestriction:
  Enabled: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/ProcLiteralReturnTypeRestriction:
  Enabled: true

Typing/MacroCallArgumentTypeRestriction:
  Enabled: true

### DISABLED ###

Documentation/DocumentationAdmonition:
  Enabled: false

